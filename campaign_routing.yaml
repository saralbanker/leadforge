# LeadForge Campaign & Offer Routing Configurations
# Modify categories and templates here to adapt outreach targets without editing python code.

campaigns:
  - name: "Manufacturing - Direct RFQ & Plant Capability"
    target_offer: "Custom B2B Industrial Catalog & Technical RFQ Portal"
    criteria:
      has_website: false
      categories:
        - "Manufacturers"
        - "Manufacturing"
        - "Engineering Works"
        - "Fabricators"
        - "CNC Machining & Precision Engineering"
        - "Boilers"
        - "Boiler Manufacturers"
        - "Industrial Boilers & Pressure Vessels"
        - "Chemicals"
        - "Chemical & Dyes Manufacturers"
        - "Chemicals & Intermediates"
        - "Industrial Valves & Process Equipment"
        - "Process Equipment"
        - "Plastic Moulding & Polymer Packaging"
        - "Transformer & Electrical Panel Manufacturers"
        - "Diamond Tooling & Laser Cutting"
        - "Steel & Metal Fabrication Works"
        - "Auto Components & Forging Works"
        - "Pharmaceutical Packaging Machinery"
        - "Industrial Machinery"
    copy_template:
      subject:
        - "website for {business_name}"
        - "direct website for {business_name}"
        - "online catalog for {business_name}"
        - "quick question re: {business_name} catalog"
        - "dedicated website for {business_name}"
      body_structure:
        middles:
          - "I am Saral Banker from Orvion, a custom software developer based here in Ahmedabad. {observation_hook} I noticed {business_name} lists equipment on IndiaMART, but you don't have your own direct website. Most large industrial buyers and EPC contractors check for an independent website before issuing purchase inquiries. I build clean, custom websites and product catalogs for manufacturers in {city} so clients can browse your technical specs directly."
          - "I am Saral Banker from Orvion, a custom software developer in Ahmedabad. {observation_hook} Many manufacturers we talk to rely mainly on directory portals like IndiaMART, but lose institutional clients who expect a standalone corporate website. I develop dedicated company websites and digital catalogs for industrial plants in {city} to showcase your equipment directly to buyers."
          - "I am Saral Banker from Orvion here in Ahmedabad, working as a custom software developer. {observation_hook} While directory listings bring leads, having your own dedicated website establishes direct trust with plant managers and procurement officers. I create custom websites and machine catalogs for engineering units in {city}."
          - "I am Saral Banker from Orvion, a custom software developer in Ahmedabad. {observation_hook} I help manufacturing businesses in {city} build modern, fast corporate websites so you own your client relationships directly rather than depending only on third-party portals."
        closings:
          - "Would you be open to a quick 5-minute call this Thursday, or can I send a brief overview on WhatsApp to this number?"
          - "Can I send a 2-minute overview on WhatsApp to this number, or would a quick call this week work better?"
          - "Would you be open to a short 5-minute call to see a few examples of sites I built for manufacturers?"
          - "Could I share a brief overview on WhatsApp to this number, or would tomorrow morning be better for a quick call?"
      followup_step2:
        subject:
          - "re: {first_subject}"
          - "rfq inquiries for {business_name}"
          - "catalog question for {business_name}"
          - "technical catalog for {business_name}"
          - "client inquiries in {city}"
        body_structure:
          - |
            wanted to see if you had a moment to think about putting together an rfq page for {business_name}.

            is sharing machine specs online something your team is considering this year?
          - |
            following up briefly on the technical catalog idea for your plant in {city}.

            are you currently looking to take on more manufacturing contracts this quarter?
          - |
            checking if putting an equipment list and rfq form online would be useful for {business_name}.

            would it help to see a quick sample for your sector?
          - |
            wanted to check if direct rfq inquiries from purchasing teams are a priority for {business_name} right now.

            do you have capacity for a few more client orders this month?
          - |
            circling back on whether an online catalog makes sense for your plant in {city}.

            would you like me to send over a brief example?
      followup_step3:
        subject:
          - "re: {first_subject}"
          - "closing the loop: {business_name}"
          - "final note re: {business_name}"
        body_structure:
          - |
            if an rfq page is not on the radar for {business_name} right now, no problem at all.

            should i check back with you in a few months?
          - |
            assuming you are all set for client inquiries in {city} for now.

            would it be better to reconnect next quarter?
          - |
            i will assume the timing is not right for {business_name}.

            is this something worth revisiting later in the year?
          - |
            no worries if direct rfq inquiries are not a focus for your shop right now.

            should i reach back out down the road?
          - |
            sounds like your production schedule is full for the moment.

            would you prefer i follow up in a few months?

