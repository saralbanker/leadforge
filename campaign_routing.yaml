# LeadForge Campaign & Offer Routing Configurations
# Modify categories and templates here to adapt outreach targets without editing python code.
#
# 2026-09-24: Every "dealer/order portal" and "website" pitch campaign was
# retired (obsolete pivot away from web-dev pitches; see
# leadforge-audit-2026-09-24 notes). The single active manufacturer campaign
# below pitches inquiry/lead-management automation instead - the only offer
# the founder (Saral Banker, Orvion) currently wants to sell. It intentionally
# has no `has_website` gate: the pitch applies whether or not the lead has a
# site, because the problem (inquiries scattered across IndiaMART, WhatsApp,
# and a website contact form) is the same either way.
#
# Truthfulness rules enforced by leadforge/outreach/quality.py
# (EmailQualityEngine.validate_body / validate_bridge) on every copy_template
# below - do not reintroduce banned patterns:
#   1. Never assert the recipient's problems as fact (no "you lose orders",
#      "buried in WhatsApp", etc.) - ask, don't diagnose.
#   2. Never imply other clients or social proof ("other manufacturers",
#      "companies like yours", "we helped", "results").
#   3. The observation hook must use only DB facts (name, product/category,
#      city/area) - nothing inferred.

campaigns:
  - name: "Manufacturing - Inquiry & Lead Management"
    target_offer: "Inquiry & Lead Tracking Automation"
    criteria:
      categories:
        - "Manufacturers"
        - "Manufacturing"
        - "Engineering Works"
        - "Fabricators"
        - "CNC Machining & Precision Engineering"
        - "Boilers"
        - "Boiler Manufacturers"
        - "Industrial Boilers & Pressure Vessels"
        - "Chemicals"
        - "Chemical & Dyes Manufacturers"
        - "Chemicals & Intermediates"
        - "Industrial Valves & Process Equipment"
        - "Process Equipment"
        - "Plastic Moulding & Polymer Packaging"
        - "Transformer & Electrical Panel Manufacturers"
        - "Diamond Tooling & Laser Cutting"
        - "Steel & Metal Fabrication Works"
        - "Auto Components & Forging Works"
        - "Pharmaceutical Packaging Machinery"
        - "Industrial Machinery"
    copy_template:
      subject:
        - "inquiry tracking for {business_name}"
        - "quick question for {business_name}"
        - "note on {business_name}'s inquiries"
        - "{business_name} - inquiry tracking"
        - "tracking inquiries at {business_name}"
      body_structure:
        middles:
          - "{contact_bridge} I'm Saral Banker from Orvion. We build simple tools that log inquiries from IndiaMART, your website, and WhatsApp in one place."
          - "{contact_bridge} I'm Saral Banker from Orvion. We set up inquiry tracking so new inquiries from different channels land in one list instead of scattered chats."
          - "{contact_bridge} I'm Saral Banker from Orvion. We build lightweight inquiry and quote tracking tools for manufacturing teams."
          - "{contact_bridge} I'm Saral Banker from Orvion. We help manufacturing teams track incoming inquiries from IndiaMART, their website, and WhatsApp in one place."
        closings:
          - "How do you currently keep track of inquiries from IndiaMART, your website, and WhatsApp?"
          - "Would it help to see how a simple inquiry tracker works?"
          - "Do most of your new inquiries come in through IndiaMART, WhatsApp, or your website?"
          - "Is tracking incoming inquiries something your team currently manages by hand?"

  - name: "Campaign B (Booking)"
    target_offer: "Custom Software Integration & Appointment Booking Portals"
    criteria:
      has_website: true
      has_booking: false
      categories:
        - "Clinics"
        - "Dentists"
        - "Doctors"
        - "Salons"
        - "Consultants"
    copy_template:
      subject:
        - "scheduling at {business_name}"
        - "online bookings for {business_name}"
        - "client bookings for {business_name}"
        - "appointment scheduling at {business_name}"
        - "booking widget for {business_name}"
      body_structure:
        middles:
          - "Without a direct booking link on your site, patients searching after hours often leave and book with another clinic. We build clean appointment calendars that connect directly to your Google listing."
          - "When patients visit your website in the evening, not having an instant booking option means they have to remember to call the next morning. We set up simple scheduling tools that let clients pick a slot directly."
          - "Most clients looking for appointments prefer booking a time slot online instead of waiting on the phone. We build straightforward scheduling pages for practices in {city}."
          - "Adding an online scheduling button lets new clients book slots directly from your website without tying up your staff on phone calls."
          - "Clients who cannot find an appointment button on your page usually look for another provider in {city} with instant scheduling. We set up fast booking pages tailored for your practice."
          - "When prospective clients look up your schedule outside office hours, phone-only booking means lost appointments. We install clean mobile booking widgets on existing practice sites."
        closings:
          - "Do you take most of your appointments by phone right now?"
          - "Would you like to see how our appointment calendar looks on mobile?"
          - "How many appointment calls does your front desk handle on an average day?"
          - "Would a simple booking calendar for {business_name} be helpful to see?"
          - "Are you looking to fill more open appointment slots this month?"
          - "Would you be open to a quick 5-minute demo of our scheduling tool?"
      body_structure_unverified:
        middles:
          - "We build simple online scheduling tools for practices in {city} so clients can book appointments directly from their phone."
          - "We set up clean appointment booking pages that let patients reserve time slots directly from your website and Google profile."
          - "Many clinics in {city} still take bookings manually over the phone, while others offer a calendar online. We create easy scheduling portals for local practices."
          - "We design lightweight booking systems for practices like {business_name} to help reduce phone tag and fill open schedule slots."
          - "Depending on your current setup, having an instant scheduling link on your website can help capture after-hours patient inquiries."
          - "We help health and service practices in {city} connect automated appointment slots to their website and search listings."
        closings:
          - "Do your clients currently book appointments online or mostly by phone?"
          - "How does your front desk currently manage incoming appointment requests?"
          - "Are you taking appointments through an online calendar, or mostly over the phone?"
          - "Would you be open to seeing a quick demo of how our booking tool works?"
          - "Is adding an online booking option something you have considered for {business_name}?"
          - "How do after-hours visitors usually request an appointment with your team?"
      followup_step2:
        subject:
          - "re: {first_subject}"
          - "scheduling at {business_name}"
          - "appointments for {business_name}"
          - "booking widget for {business_name}"
        body_structure:
          - |
            wanted to see if adding an online booking link to your website would help patients in {city} schedule after hours.

            would you like to see how our appointment calendar looks on mobile?
          - |
            following up on whether direct appointment scheduling makes sense for {business_name}.

            are you looking to fill more open appointment slots this month?
          - |
            checking if reducing phone calls for appointment scheduling is a goal for your team at {business_name}.

            how many booking calls does your front desk handle each day?
          - |
            wanted to see if letting clients pick a slot directly from your site would be useful for {business_name}.

            would a simple booking calendar be helpful to see?
          - |
            circling back on appointment scheduling for your practice in {city}.

            are you open to a brief chat to see how it works?
        body_structure_unverified:
          - |
            wanted to check how your front desk currently manages appointment requests for {business_name}.

            do your clients book appointments online or mostly by phone right now?
          - |
            following up on scheduling for {business_name} in {city}.

            is adding an online booking option something you have considered?
          - |
            checking to see if appointment scheduling is an area you are looking to update for {business_name}.

            how does your team currently handle after-hours booking requests?
          - |
            wanted to see if a direct scheduling tool would be helpful for {business_name}.

            would you be open to seeing a quick demo of how our booking tool works?
          - |
            circling back to see if online scheduling is on the roadmap for your practice in {city}.

            is this worth a short conversation this week?
      followup_step3:
        subject:
          - "re: {first_subject}"
          - "closing the loop: {business_name}"
          - "final note re: appointments"
        body_structure:
          - |
            if online scheduling is not something you need for {business_name} right now, no problem at all.

            should i follow up with you in a few months?
          - |
            assuming your current booking process is working well for your front desk in {city}.

            would you like me to check back next quarter?
          - |
            i will assume your schedule is full at {business_name} for the time being.

            would later in the year be a better time to connect?
          - |
            no worries if adding appointment booking is not a focus for your team right now.

            should i reach back out down the road?
          - |
            sounds like your front desk workflow is running smoothly as is.

            is this something to revisit in the future?
        body_structure_unverified:
          - |
            if appointment scheduling is already working well for {business_name}, no problem at all.

            should i reconnect with you later in the year?
          - |
            assuming your current appointment setup is meeting your needs in {city}.

            would you prefer i check back in a few months?
          - |
            i will assume this is not a priority for {business_name} right now.

            should i reach out again next quarter?
          - |
            no worries if scheduling is not an area you are looking to change.

            would next quarter be a better time to connect?
          - |
            sounds like everything is running fine for your team at {business_name}.

            should i check in with you down the road?

